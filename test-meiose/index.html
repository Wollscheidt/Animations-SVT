<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Je me teste sur la méiose</title>

    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

    <style>
        body {
            margin: 0;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #animation {
            width: 900px;
            height: 650px;
        }
    </style></head>

<body>
</head>

<div id="animation"></div>

<script>
    window.RufflePlayer = window.RufflePlayer || {};

    window.addEventListener("load", () => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();

        document.getElementById("animation").appendChild(player);

        player.load("Je_me_teste_sur_la_meiose.swf");
    });
</script>

</body>
</html>
